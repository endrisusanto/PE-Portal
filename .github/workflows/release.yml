name: Release PE-Portal Desktop App

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release Tag (e.g. v1.0.0)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  release:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'windows-latest'
            target: 'x86_64-pc-windows-msvc'

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Go Runtime
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache-dependency-path: backend/go.sum

      - name: Setup Node.js Runtime
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: |
            frontend/package-lock.json
            desktop/package-lock.json

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Rust Dependencies
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './desktop/src-tauri -> target'

      - name: Build Go Backend Binary
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "bin"
          cd backend
          go build -ldflags="-w -s" -o "..\bin\pe-portal-backend.exe" ./cmd/server
          cd ..
          Get-Item "bin\pe-portal-backend.exe"

      - name: Build Frontend Web SPA
        shell: pwsh
        run: |
          cd frontend
          npm ci
          npm run build
          cd ..

      - name: Prepare Desktop App Resources
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "desktop\src-tauri\resources"
          Copy-Item -Path "bin\pe-portal-backend.exe" -Destination "desktop\src-tauri\resources\pe-portal-backend.exe"
          New-Item -ItemType Directory -Force -Path "desktop\src-tauri\resources\frontend"
          Copy-Item -Path "frontend\dist\*" -Destination "desktop\src-tauri\resources\frontend" -Recurse
          if (Test-Path "desktop\src-tauri\resources\frontend\models") {
            Remove-Item -Recurse -Force "desktop\src-tauri\resources\frontend\models"
          }

      - name: Install & Build Desktop UI
        shell: pwsh
        run: |
          cd desktop
          npm ci
          npm run build
          cd ..

      - name: Determine Release Tag
        id: release_tag
        shell: pwsh
        run: |
          $inputTag = "${{ github.event.inputs.tag }}"
          if ($inputTag -ne "") {
            $tag = $inputTag
          } elseif ("${{ github.ref_type }}" -eq "tag") {
            $tag = "${{ github.ref_name }}"
          } else {
            $pkg = Get-Content -Raw -Path "desktop\package.json" | ConvertFrom-Json
            $tag = "v" + $pkg.version
          }
          Write-Host "Resolved release tag: $tag"
          "TAG=$tag" >> $env:GITHUB_OUTPUT

      - name: Build Tauri Application & Publish GitHub Release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: './desktop'
          tagName: ${{ steps.release_tag.outputs.TAG }}
          releaseName: 'PE-Portal Desktop ${{ steps.release_tag.outputs.TAG }}'
          releaseBody: 'Automated release for SEIN PE-Portal Desktop Tray Manager ${{ steps.release_tag.outputs.TAG }}'
          releaseDraft: false
          prerelease: false
