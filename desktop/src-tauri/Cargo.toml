[package]
name = "pe_portal_manager"
version = "1.0.0"
description = "SEIN PE-Portal Desktop Tray Manager & Launcher"
authors = ["SEIN Production Engineer Team"]
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "pe_portal_manager_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-log = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
tokio = { version = "1", features = ["full"] }
