version: '3.8'

services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: pe-portal-frontend
    ports:
      - "${FRONTEND_PORT:-3025}:80"
    restart: unless-stopped
    depends_on:
      - backend

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: pe-portal-backend
    ports:
      - "${BACKEND_PORT:-8085}:8080"
    restart: unless-stopped
    environment:
      - PORT=8080
      - DATABASE_URL=postgres://${POSTGRES_USER:-pe_portal}:${DB_PASSWORD:-sein_pe_portal_secret_2026}@postgres:5432/${POSTGRES_DB:-pe_portal}?sslmode=disable
      - REDIS_URL=redis://redis:6379
      - JWT_SECRET=${JWT_SECRET:-pe_portal_jwt_secret_super_secure_key_2026_sein_pe_group_random_64}
      - FILE_STORAGE_PATH=/data/files
      - AUTH_PROVIDER=${AUTH_PROVIDER:-local}
      - GBA_API_URL=${GBA_API_URL:-http://107.102.39.55/tkdn/api_kanban.php}
      - SOFTWARE_MR_URL=${SOFTWARE_MR_URL:-http://107.102.39.55/companion-release-cheatsheet}
    volumes:
      - file_storage:/data/files
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  postgres:
    image: pgvector/pgvector:pg16
    container_name: pe-portal-postgres
    restart: unless-stopped
    environment:
      - POSTGRES_DB=${POSTGRES_DB:-pe_portal}
      - POSTGRES_USER=${POSTGRES_USER:-pe_portal}
      - POSTGRES_PASSWORD=${DB_PASSWORD:-sein_pe_portal_secret_2026}
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./migrations:/docker-entrypoint-initdb.d
    ports:
      - "${DB_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-pe_portal} -d ${POSTGRES_DB:-pe_portal}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: pe-portal-redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  pg_data:
  redis_data:
  file_storage:
